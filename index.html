<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <meta name="description" content="A simple hello-world single page application for GitHub Pages.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">Hello<span>World</span></a>
      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>

        <ul>
          <li><a href="#/" data-route="/">Home</a></li>
